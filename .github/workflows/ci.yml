name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgres://ops_hub:ops_hub@localhost:5432/ops_hub

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ops_hub
          POSTGRES_PASSWORD: ops_hub
          POSTGRES_DB: ops_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_hub -d ops_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: back_cargo -> target

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sqlx-cli
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: sqlx-cli@0.9

      - name: Run database migrations
        working-directory: back_cargo
        run: cargo sqlx migrate run

      - name: Verify
        run: make verify